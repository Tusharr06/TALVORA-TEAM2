[project]
name = "talvora-backend"
version = "0.1.0"
description = "Talvora Intelligent Talent Operations Workspace Backend"
readme = "README.md"
requires-python = ">=3.13,<3.14"
dependencies = [
    "fastapi>=0.115.8,<0.116.0",
    "pydantic>=2.10.6,<2.11.0",
    "pydantic-settings>=2.7.1,<2.8.0",
    "uvicorn[standard]>=0.34.0,<0.35.0",
    "sqlalchemy[asyncio]>=2.0.38,<2.1.0",
    "psycopg[binary]>=3.2.4,<3.3.0",
    "alembic>=1.14.1,<1.15.0",
    "httpx>=0.28.1,<0.29.0",
    "boto3>=1.36.10,<1.37.0",
    "cryptography>=44.0.0,<45.0.0",
    "authlib>=1.4.1,<1.5.0",
    "defusedxml>=0.7.1,<0.8.0",
    "python-multipart>=0.0.20,<0.1.0",
    "pypdf>=5.1.0,<5.2.0",
    "python-docx>=1.1.2,<1.2.0",
    "pypdfium2>=4.28.0,<5.1.0",
    "pillow>=11.0.0,<12.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.4",
    "pytest-asyncio>=0.25.3",
    "hypothesis>=6.124.7",
    "ruff>=0.9.6",
    "mypy>=1.15.0",
    "moto[server,s3,sqs]>=5.0.28",
    "types-boto3>=1.36.10",
    "aiosqlite>=0.20.0",
    "reportlab>=4.2.5,<4.3.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/talvora"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "A", "C4", "T20", "SIM"]
ignore = ["E501", "B008", "N818", "SIM117"]

[tool.mypy]
python_version = "3.13"
strict = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_untyped_decorators = false
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true

[[tool.mypy.overrides]]
module = "defusedxml.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["pypdfium2.*", "reportlab.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = [
    "unit: Unit tests",
    "integration: Integration tests requiring database/services",
    "live: Live provider tests (requires explicit credentials)",
]
